name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest가 26.04가 되자 Playwright 1.56.1이 chromium을 설치하지 못했다(2026-11-07) — Playwright를 올리기 전까지 24.04로 고정
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 단위 테스트
        run: npm test

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 빌드 + 브라우저 테스트
        run: npm run test:e2e

      - name: 빌드된 게임 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: games
          path: dist/

      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
